# Karpenter v1 (karpenter.sh/v1) 用 NodePool + EC2NodeClass
# - amiFamily: AL2023
# - Spot 優先 / On-Demand fallback
# - consolidation で idle node を 1 分でリサイズ
# - limits で暴走防止

apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: "karpenter-node-bootcamp"   # terraform module が作る Role 名と合わせる
  subnetSelectorTerms:
    - tags:
        "kubernetes.io/role/internal-elb": "1"
  securityGroupSelectorTerms:
    - tags:
        "aws:eks:cluster-name": "bootcamp"
  tags:
    Project: k8s-bootcamp
    Track: C
    karpenter.sh/discovery: bootcamp
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        provisioner: karpenter
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4", "8"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      expireAfter: 720h   # 30 日で強制ローテーション
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"      # 一度に 10% しか壊さない
  limits:
    cpu: "50"
    memory: "100Gi"
