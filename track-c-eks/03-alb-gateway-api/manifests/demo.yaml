apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: default
spec:
  replicas: 2
  selector: { matchLabels: { app: hello } }
  template:
    metadata: { labels: { app: hello } }
    spec:
      containers:
        - name: hello
          image: hashicorp/http-echo:1.0.0
          args: ["-text=hello from EKS Gateway API", "-listen=:8080"]
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: default
spec:
  selector: { app: hello }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: default
  annotations:
    alb.gateway.kubernetes.io/scheme: internet-facing
    alb.gateway.kubernetes.io/target-type: ip
    alb.gateway.kubernetes.io/load-balancer-attributes: |
      idle_timeout.timeout_seconds=60
spec:
  gatewayClassName: aws-alb
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: default
spec:
  parentRefs:
    - name: public
  hostnames: ["hello.example.com"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: "/" }
      backendRefs:
        - name: hello
          port: 80
