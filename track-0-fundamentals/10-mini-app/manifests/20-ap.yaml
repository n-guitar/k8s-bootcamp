---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ap-config
  namespace: mini-app
data:
  MESSAGE: "hello from FastAPI on Kubernetes"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ap
  namespace: mini-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ap
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ap
    spec:
      # PSA restricted も通る最小設定
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ap
          # ローカル build した image を kind load で取り込んでおく
          # 別 image を使う場合は ./app/Dockerfile を build して差し替え
          image: mini-ap:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: ap-config
                  key: MESSAGE
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-cred
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ap
  namespace: mini-app
spec:
  selector:
    app: ap
  ports:
    - port: 8080
      targetPort: 8080
