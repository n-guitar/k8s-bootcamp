---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: mini-app
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        proxy_pass http://ap.mini-app.svc.cluster.local:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mini-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: cfg
              mountPath: /etc/nginx/conf.d/
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: cfg
          configMap:
            name: web-config
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mini-app
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
